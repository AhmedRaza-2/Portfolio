<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="tradeops-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="sheet-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#tradeops-bg)" />

  <!-- Subtle Blueprint Tech Grid -->
  <g stroke="#1e293b" stroke-width="0.8" opacity="0.4">
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="350" x2="800" y2="350" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
  </g>

  <!-- Top System Header Bar -->
  <rect x="30" y="20" width="740" height="44" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
  <circle cx="50" cy="42" r="5" fill="#ef4444" />
  <circle cx="66" cy="42" r="5" fill="#eab308" />
  <circle cx="82" cy="42" r="5" fill="#22c55e" />
  <text x="105" y="46" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">TRADEOPS // AUTOMATED BANK INVOICE OCR &amp; FIELD EXTRACTION PIPELINE</text>
  <rect x="635" y="29" width="120" height="26" rx="13" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
  <text x="695" y="46" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">~40 FIELDS PARSED</text>

  <!-- Central Invoice Document (Skewed / Perspective Shadow) -->
  <g transform="translate(60, 80)" filter="url(#shadow)">
    <!-- Paper Body -->
    <rect width="440" height="340" rx="6" fill="url(#sheet-grad)" stroke="#cbd5e1" stroke-width="1" />
    
    <!-- Invoice Header & Logo -->
    <rect x="24" y="24" width="36" height="36" rx="6" fill="#0f172a" />
    <text x="42" y="47" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="900" text-anchor="middle">A</text>
    <text x="70" y="40" fill="#0f172a" font-family="sans-serif" font-size="15" font-weight="800">COMMERCIAL INVOICE</text>
    <text x="70" y="53" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="500">Askari Bank Trade Finance Document Processing</text>
    
    <!-- Invoice Details Row -->
    <rect x="24" y="74" width="392" height="42" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
    <text x="34" y="90" fill="#64748b" font-family="sans-serif" font-size="9" font-weight="600">INVOICE NO.</text>
    <text x="34" y="105" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="700">INV-2026-89421</text>
    
    <text x="140" y="90" fill="#64748b" font-family="sans-serif" font-size="9" font-weight="600">BILLING DATE</text>
    <text x="140" y="105" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="700">14-AUG-2026</text>
    
    <text x="240" y="90" fill="#64748b" font-family="sans-serif" font-size="9" font-weight="600">LC REFERENCE</text>
    <text x="240" y="105" fill="#0f172a" font-family="sans-serif" font-size="11" font-weight="700">AKBL-TF-7729</text>

    <!-- OCR Bounding Box 1: Dynamic Highlight on Invoice Number -->
    <rect x="28" y="76" width="95" height="36" rx="2" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3 2" />
    <rect x="28" y="66" width="54" height="12" rx="2" fill="#0284c7" />
    <text x="55" y="75" fill="#ffffff" font-family="sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">OCR: INV_ID</text>

    <!-- Table Header -->
    <rect x="24" y="128" width="392" height="22" fill="#0f172a" rx="3" />
    <text x="34" y="143" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="700">DESCRIPTION OF GOODS</text>
    <text x="230" y="143" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="700">HS CODE</text>
    <text x="300" y="143" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="700">QTY</text>
    <text x="360" y="143" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="700">AMOUNT</text>

    <!-- Row 1 -->
    <text x="34" y="166" fill="#1e293b" font-family="sans-serif" font-size="9" font-weight="600">Industrial Computing Unit X-400</text>
    <text x="230" y="166" fill="#475569" font-family="sans-serif" font-size="9">8471.49.00</text>
    <text x="300" y="166" fill="#475569" font-family="sans-serif" font-size="9">120 PCS</text>
    <text x="360" y="166" fill="#0f172a" font-family="sans-serif" font-size="9" font-weight="700">$74,400.00</text>
    <line x1="24" y1="176" x2="416" y2="176" stroke="#e2e8f0" stroke-width="0.8" />

    <!-- Row 2 -->
    <text x="34" y="196" fill="#1e293b" font-family="sans-serif" font-size="9" font-weight="600">Power Supply &amp; Sensor Modules</text>
    <text x="230" y="196" fill="#475569" font-family="sans-serif" font-size="9">8504.40.90</text>
    <text x="300" y="196" fill="#475569" font-family="sans-serif" font-size="9">450 SETS</text>
    <text x="360" y="196" fill="#0f172a" font-family="sans-serif" font-size="9" font-weight="700">$48,600.00</text>
    <line x1="24" y1="206" x2="416" y2="206" stroke="#e2e8f0" stroke-width="0.8" />

    <!-- OCR Bounding Box 2: Line items bounding box -->
    <rect x="22" y="126" width="396" height="84" rx="2" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4 2" />
    <rect x="22" y="116" width="70" height="12" rx="2" fill="#10b981" />
    <text x="57" y="125" fill="#ffffff" font-family="sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">OCR: ITEMS_TABLE</text>

    <!-- Total Box -->
    <rect x="24" y="222" width="392" height="42" rx="4" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <text x="34" y="247" fill="#334155" font-family="sans-serif" font-size="11" font-weight="700">TOTAL PAYABLE (USD)</text>
    <text x="340" y="248" fill="#047857" font-family="sans-serif" font-size="16" font-weight="900">$123,000.00</text>
    
    <!-- OCR Bounding Box 3: Total -->
    <rect x="325" y="228" width="88" height="30" rx="3" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="3 2" />
    <rect x="325" y="218" width="60" height="12" rx="2" fill="#f59e0b" />
    <text x="355" y="227" fill="#ffffff" font-family="sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">OCR: TOTAL_VAL</text>

    <!-- Stamp -->
    <g transform="translate(180, 275) rotate(-8)">
      <rect width="130" height="34" rx="5" fill="none" stroke="#059669" stroke-width="2" />
      <text x="65" y="16" fill="#059669" font-family="sans-serif" font-size="9" font-weight="800" text-anchor="middle" letter-spacing="1">VERIFIED &amp; INGESTED</text>
      <text x="65" y="28" fill="#059669" font-family="sans-serif" font-size="7.5" font-weight="600" text-anchor="middle">ASKARI TRADE OPS</text>
    </g>
  </g>

  <!-- Right Side: Real-time Extraction Pipeline Card -->
  <g transform="translate(525, 80)">
    <rect width="245" height="340" rx="10" fill="#0f172a" fill-opacity="0.95" stroke="#334155" stroke-width="1.2" />
    
    <!-- Card Title -->
    <rect x="16" y="16" width="213" height="32" rx="6" fill="#1e293b" />
    <circle cx="32" cy="32" r="5" fill="#38bdf8" />
    <text x="44" y="36" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="700">EXTRACTED SCHEMA</text>
    <text x="215" y="36" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="end">LIVE</text>

    <!-- Field 1 -->
    <rect x="16" y="58" width="213" height="38" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="0.8" />
    <text x="26" y="72" fill="#94a3b8" font-family="sans-serif" font-size="9" font-weight="600">invoice_number</text>
    <text x="26" y="87" fill="#38bdf8" font-family="Courier, monospace" font-size="11" font-weight="700">"INV-2026-89421"</text>
    <text x="215" y="80" fill="#10b981" font-family="sans-serif" font-size="12">✓</text>

    <!-- Field 2 -->
    <rect x="16" y="102" width="213" height="38" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="0.8" />
    <text x="26" y="116" fill="#94a3b8" font-family="sans-serif" font-size="9" font-weight="600">lc_reference_id</text>
    <text x="26" y="131" fill="#38bdf8" font-family="Courier, monospace" font-size="11" font-weight="700">"AKBL-TF-7729"</text>
    <text x="215" y="124" fill="#10b981" font-family="sans-serif" font-size="12">✓</text>

    <!-- Field 3 -->
    <rect x="16" y="146" width="213" height="38" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="0.8" />
    <text x="26" y="160" fill="#94a3b8" font-family="sans-serif" font-size="9" font-weight="600">total_amount_usd</text>
    <text x="26" y="175" fill="#34d399" font-family="Courier, monospace" font-size="11" font-weight="700">123000.00</text>
    <text x="215" y="168" fill="#10b981" font-family="sans-serif" font-size="12">✓</text>

    <!-- Field 4 -->
    <rect x="16" y="190" width="213" height="38" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="0.8" />
    <text x="26" y="204" fill="#94a3b8" font-family="sans-serif" font-size="9" font-weight="600">line_items_count</text>
    <text x="26" y="219" fill="#e2e8f0" font-family="Courier, monospace" font-size="11" font-weight="700">2 items parsed</text>
    <text x="215" y="212" fill="#10b981" font-family="sans-serif" font-size="12">✓</text>

    <!-- Database Storage Badge -->
    <rect x="16" y="238" width="213" height="42" rx="6" fill="#047857" fill-opacity="0.2" stroke="#059669" stroke-width="1" />
    <text x="26" y="254" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="700">TARGET: SQL Server Database</text>
    <text x="26" y="269" fill="#a7f3d0" font-family="sans-serif" font-size="9">Manual entry eliminated &#8226; 100% automated</text>

    <!-- Summary Footnote -->
    <rect x="16" y="290" width="213" height="36" rx="6" fill="#1e293b" />
    <text x="122" y="306" fill="#94a3b8" font-family="sans-serif" font-size="9" font-weight="600" text-anchor="middle">EXTRACTION LATENCY</text>
    <text x="122" y="320" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">&lt; 1.2s per invoice document</text>
  </g>
</svg>
