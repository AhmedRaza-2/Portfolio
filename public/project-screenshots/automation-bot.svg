    <g transform="translate(16, 58)">
      <rect width="238" height="44" rx="6" fill="#101b2f" stroke="#1f2d47" stroke-width="1" />
      <circle cx="16" cy="22" r="4" fill="#10b981" />
      <text x="28" y="20" fill="#f1f5f9" font-family="sans-serif" font-size="9.5" font-weight="700">US-East Node (Virginia)</text>
      <text x="28" y="34" fill="#94a3b8" font-family="Courier, monospace" font-size="8.5">Ping: 18ms &#8226; Residential IP</text>
    </g>

    <!-- Proxy Node 2 -->
    <g transform="translate(16, 110)">
      <rect width="238" height="44" rx="6" fill="#101b2f" stroke="#1f2d47" stroke-width="1" />
      <circle cx="16" cy="22" r="4" fill="#10b981" />
      <text x="28" y="20" fill="#f1f5f9" font-family="sans-serif" font-size="9.5" font-weight="700">EU-West Node (Frankfurt)</text>
      <text x="28" y="34" fill="#94a3b8" font-family="Courier, monospace" font-size="8.5">Ping: 24ms &#8226; Rotating Subnet</text>
    </g>

    <!-- Proxy Node 3 -->
    <g transform="translate(16, 162)">
      <rect width="238" height="44" rx="6" fill="#101b2f" stroke="#1f2d47" stroke-width="1" />
      <circle cx="16" cy="22" r="4" fill="#10b981" />
      <text x="28" y="20" fill="#f1f5f9" font-family="sans-serif" font-size="9.5" font-weight="700">AP-South Node (Singapore)</text>
      <text x="28" y="34" fill="#94a3b8" font-family="Courier, monospace" font-size="8.5">Ping: 42ms &#8226; Active Worker #3</text>
    </g>

    <!-- Modular Plugins -->
    <g transform="translate(16, 222)">
      <rect width="238" height="105" rx="6" fill="#101b2f" stroke="#1f2d47" stroke-width="1" />
      <text x="14" y="20" fill="#60a5fa" font-family="sans-serif" font-size="9.5" font-weight="800">SUPPORTED MODULES</text>
      <text x="14" y="38" fill="#e2e8f0" font-family="sans-serif" font-size="8.5">&#8226; YouTube Channel &amp; Analytics Scraper</text>
      <text x="14" y="54" fill="#e2e8f0" font-family="sans-serif" font-size="8.5">&#8226; Automated Form Filler &amp; Lead Poster</text>
      <text x="14" y="70" fill="#e2e8f0" font-family="sans-serif" font-size="8.5">&#8226; Multi-tab Session State Persister</text>
      <text x="14" y="86" fill="#e2e8f0" font-family="sans-serif" font-size="8.5">&#8226; Headless Browser DOM Parser</text>
    </g>
  </g>
</svg>