<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="enc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081216" />
      <stop offset="50%" stop-color="#0d1d24" />
      <stop offset="100%" stop-color="#04090b" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#enc-bg)" />

  <!-- Matrix Hex / Grid -->
  <g stroke="#134e4a" stroke-width="0.6" opacity="0.25">
    <line x1="0" y1="70" x2="800" y2="70" />
    <line x1="0" y1="140" x2="800" y2="140" />
    <line x1="0" y1="210" x2="800" y2="210" />
    <line x1="0" y1="280" x2="800" y2="280" />
    <line x1="0" y1="350" x2="800" y2="350" />
  </g>

  <!-- Top System Header -->
  <rect x="25" y="16" width="750" height="46" rx="8" fill="#0e262c" stroke="#134e4a" stroke-width="1.2" />
  <rect x="38" y="26" width="26" height="26" rx="6" fill="#0d9488" />
  <circle cx="51" cy="37" r="4" fill="none" stroke="#ffffff" stroke-width="1.8" />
  <rect x="47" y="37" width="8" height="7" rx="1" fill="#ffffff" />
  <text x="74" y="37" fill="#f0fdfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" letter-spacing="0.4">NATIONAL CERT // FILE ENCRYPTION &amp; DECRYPTION UTILITY</text>
  <text x="74" y="51" fill="#5eead4" font-family="sans-serif" font-size="9.5">Python Cryptography Engine &#8226; AES-256-GCM &#8226; RSA-4096 &#8226; Triple DES &#8226; SHA-512 Hash Verification</text>

  <rect x="635" y="26" width="125" height="26" rx="13" fill="#0d9488" fill-opacity="0.2" stroke="#14b8a6" stroke-width="1" />
  <circle cx="650" cy="39" r="4" fill="#14b8a6" />
  <text x="662" y="43" fill="#5eead4" font-family="sans-serif" font-size="10" font-weight="800">10+ CIPHERS</text>

  <!-- Main GUI Window (Tkinter Cyber Styled) -->
  <g transform="translate(25, 74)">
    <rect width="480" height="350" rx="10" fill="#0a181c" stroke="#134e4a" stroke-width="1.2" />
    
    <text x="20" y="30" fill="#f0fdfa" font-family="sans-serif" font-size="12" font-weight="700">CRYPTOGRAPHIC CONTROL PANEL</text>
    
    <!-- Cipher Algorithm Selector Tabs -->
    <g transform="translate(20, 44)">
      <rect x="0" y="0" width="80" height="26" rx="4" fill="#0d9488" />
      <text x="40" y="17" fill="#ffffff" font-family="sans-serif" font-size="9.5" font-weight="800" text-anchor="middle">AES-256</text>

      <rect x="86" y="0" width="75" height="26" rx="4" fill="#132b31" stroke="#1e4b52" stroke-width="0.8" />
      <text x="123" y="17" fill="#99f6e4" font-family="sans-serif" font-size="9.5" text-anchor="middle">RSA-4096</text>

      <rect x="167" y="0" width="75" height="26" rx="4" fill="#132b31" stroke="#1e4b52" stroke-width="0.8" />
      <text x="204" y="17" fill="#99f6e4" font-family="sans-serif" font-size="9.5" text-anchor="middle">Triple DES</text>

      <rect x="248" y="0" width="75" height="26" rx="4" fill="#132b31" stroke="#1e4b52" stroke-width="0.8" />
      <text x="285" y="17" fill="#99f6e4" font-family="sans-serif" font-size="9.5" text-anchor="middle">ChaCha20</text>

      <rect x="329" y="0" width="95" height="26" rx="4" fill="#132b31" stroke="#1e4b52" stroke-width="0.8" />
      <text x="376" y="17" fill="#99f6e4" font-family="sans-serif" font-size="9.5" text-anchor="middle">SHA-512 Hash</text>
    </g>

    <!-- File Target Selection -->
    <g transform="translate(20, 84)">
      <rect width="440" height="48" rx="6" fill="#0f2329" stroke="#194d54" stroke-width="1" />
      <text x="16" y="20" fill="#99f6e4" font-family="sans-serif" font-size="9.5" font-weight="700">SELECTED TARGET FILE:</text>
      <text x="16" y="36" fill="#ffffff" font-family="Courier, monospace" font-size="10.5">classified_bank_audit_2026.pdf (14.2 MB)</text>
      <rect x="350" y="12" width="75" height="24" rx="4" fill="#134e4a" />
      <text x="387" y="28" fill="#5eead4" font-family="sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Browse...</text>
    </g>

    <!-- Hex Cipher Stream Stream View -->
    <g transform="translate(20, 146)">
      <rect width="440" height="110" rx="6" fill="#061013" stroke="#113a3e" stroke-width="1" />
      <text x="14" y="20" fill="#14b8a6" font-family="sans-serif" font-size="9" font-weight="800">HEXADECIMAL ENCRYPTION BUFFER STREAM</text>
      <text x="14" y="40" fill="#2dd4bf" font-family="Courier, monospace" font-size="9.5">00000000: 4a 8f 9c 12 3b e4 71 d0  5a 19 82 bb 90 ff cc 21  J...;..q.Z....!</text>
      <text x="14" y="56" fill="#2dd4bf" font-family="Courier, monospace" font-size="9.5">00000010: e1 08 47 a3 d4 29 80 14  ab 4c 11 02 88 ea 65 39  ..G..)...L....e9</text>
      <text x="14" y="72" fill="#2dd4bf" font-family="Courier, monospace" font-size="9.5">00000020: 77 b1 05 9f c2 d3 18 ae  20 54 8f 33 6d e9 a1 40  w....... T.3m..@</text>
      <text x="14" y="88" fill="#2dd4bf" font-family="Courier, monospace" font-size="9.5">00000030: f9 11 8c 42 01 7e 8a cc  45 9b 13 22 70 81 3f 5a  ...B.~..E.."p.?Z</text>
      <text x="14" y="102" fill="#5eead4" font-family="Courier, monospace" font-size="8.5">Status: 256-bit Key Generated with PBKDF2 (100,000 rounds salt)</text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(20, 270)">
      <rect x="0" y="0" width="210" height="42" rx="6" fill="#0d9488" />
      <text x="105" y="26" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">ENCRYPT FILE (.ENC)</text>

      <rect x="230" y="0" width="210" height="42" rx="6" fill="#115e59" />
      <text x="335" y="26" fill="#f0fdfa" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">DECRYPT &amp; VERIFY HASH</text>
    </g>
  </g>

  <!-- Right: Cryptographic Metrics Card -->
  <g transform="translate(520, 74)">
    <rect width="255" height="350" rx="10" fill="#0a181c" stroke="#134e4a" stroke-width="1.2" />

    <rect x="16" y="16" width="223" height="32" rx="6" fill="#132b31" />
    <text x="127" y="36" fill="#f0fdfa" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">SECURITY AUDIT VERIFICATION</text>

    <!-- Integrity Hash -->
    <g transform="translate(16, 60)">
      <rect width="223" height="56" rx="6" fill="#0d2328" stroke="#134e4a" stroke-width="1" />
      <text x="12" y="20" fill="#5eead4" font-family="sans-serif" font-size="9" font-weight="700">SHA-256 HASH CHECKSUM</text>
      <text x="12" y="36" fill="#ffffff" font-family="Courier, monospace" font-size="8.5">e3b0c44298fc1c149afbf4c8...</text>
      <text x="12" y="48" fill="#34d399" font-family="sans-serif" font-size="8" font-weight="700">&#10003; 100% Cryptographic Match</text>
    </g>

    <!-- Key Strength Card -->
    <g transform="translate(16, 128)">
      <rect width="223" height="80" rx="6" fill="#0d2328" stroke="#134e4a" stroke-width="1" />
      <text x="12" y="22" fill="#99f6e4" font-family="sans-serif" font-size="9" font-weight="700">ENTROPY &amp; KEY RESISTANCE</text>
      <text x="12" y="46" fill="#14b8a6" font-family="sans-serif" font-size="20" font-weight="900">256 Bits</text>
      <text x="110" y="46" fill="#5eead4" font-family="sans-serif" font-size="9" font-weight="700">Military Grade</text>
      <rect x="12" y="58" width="200" height="4" rx="2" fill="#134e4a" />
      <rect x="12" y="58" width="200" height="4" rx="2" fill="#2dd4bf" />
    </g>

    <!-- CERT Badge -->
    <g transform="translate(16, 222)">
      <rect width="223" height="95" rx="8" fill="#134e4a" fill-opacity="0.3" stroke="#0d9488" stroke-width="1" />
      <text x="14" y="22" fill="#2dd4bf" font-family="sans-serif" font-size="10" font-weight="800">NATIONAL CERT PAKISTAN</text>
      <text x="14" y="40" fill="#ccfbf1" font-family="sans-serif" font-size="8.5">DevSecOps Cybersecurity Tooling</text>
      <text x="14" y="56" fill="#99f6e4" font-family="sans-serif" font-size="8">Rigorous cryptographic standard verification for protecting enterprise payloads.</text>
      <rect x="14" y="68" width="195" height="16" rx="3" fill="#0d9488" />
      <text x="111" y="80" fill="#ffffff" font-family="sans-serif" font-size="8" font-weight="800" text-anchor="middle">VERIFIED SECURE IMPLEMENTATION</text>
    </g>
  </g>
</svg>