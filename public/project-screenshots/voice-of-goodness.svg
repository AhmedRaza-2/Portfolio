<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="charity-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061a14" />
      <stop offset="50%" stop-color="#0a2e23" />
      <stop offset="100%" stop-color="#03100c" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#charity-bg)" />

  <!-- Grid -->
  <g stroke="#134e38" stroke-width="0.6" opacity="0.25">
    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
  </g>

  <!-- Web Browser Window -->
  <rect x="30" y="20" width="740" height="410" rx="10" fill="#0d2b20" stroke="#1b4f3b" stroke-width="1.5" />
  
  <rect x="30" y="20" width="740" height="36" rx="10" fill="#12382a" />
  <circle cx="50" cy="38" r="4.5" fill="#ef4444" />
  <circle cx="66" cy="38" r="4.5" fill="#eab308" />
  <circle cx="82" cy="38" r="4.5" fill="#22c55e" />

  <!-- URL bar -->
  <rect x="110" y="26" width="320" height="24" rx="6" fill="#1b4f3b" />
  <text x="122" y="42" fill="#a7f3d0" font-family="sans-serif" font-size="10.5">https://amdevworks21.github.io/VoiceOfGoodness</text>

  <!-- Live Status -->
  <rect x="615" y="26" width="135" height="24" rx="12" fill="#10b981" fill-opacity="0.2" stroke="#34d399" stroke-width="0.8" />
  <circle cx="630" cy="38" r="3.5" fill="#34d399" />
  <text x="642" y="42" fill="#a7f3d0" font-family="sans-serif" font-size="9.5" font-weight="800">LIVE PLATFORM</text>

  <!-- Hero Content inside page -->
  <g transform="translate(50, 75)">
    <rect x="0" y="0" width="700" height="165" rx="8" fill="#12382a" stroke="#1b4f3b" stroke-width="1" />

    <!-- Organization branding -->
    <rect x="24" y="22" width="32" height="32" rx="6" fill="#059669" />
    <path d="M32 38 C32 30 48 30 48 38 C48 44 40 48 40 48 C40 48 32 44 32 38 Z" fill="#ffffff" />
    <text x="66" y="37" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="800">SOUT UL KHAIR &#8211; VOICE OF GOODNESS</text>
    <text x="66" y="51" fill="#6ee7b7" font-family="sans-serif" font-size="10">Empowering Communities &#8226; Transparent Welfare Initiatives &#8226; Education &amp; Relief</text>

    <text x="24" y="92" fill="#ffffff" font-family="sans-serif" font-size="22" font-weight="900">Building Hope Through Compassionate Action</text>
    <text x="24" y="116" fill="#d1fae5" font-family="sans-serif" font-size="12.5">Dedicated to providing essential relief, clean water, and educational opportunities to underprivileged families.</text>

    <!-- Donation Buttons -->
    <rect x="24" y="130" width="130" height="24" rx="4" fill="#10b981" />
    <text x="89" y="146" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">Donate Now &#8594;</text>

    <rect x="164" y="130" width="130" height="24" rx="4" fill="#1b4f3b" stroke="#34d399" stroke-width="0.8" />
    <text x="229" y="146" fill="#a7f3d0" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Volunteer With Us</text>
  </g>

  <!-- 3 Campaign Metric Cards -->
  <g transform="translate(50, 255)">
    <rect x="0" y="0" width="220" height="150" rx="8" fill="#12382a" stroke="#1b4f3b" stroke-width="1" />
    <text x="18" y="26" fill="#6ee7b7" font-family="sans-serif" font-size="10" font-weight="700">EDUCATION SPONSORSHIP</text>
    <text x="18" y="54" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="900">1,250+ Students</text>
    <text x="18" y="72" fill="#a7f3d0" font-family="sans-serif" font-size="9">Books, uniforms &amp; schooling aid provided.</text>
    <rect x="18" y="92" width="184" height="8" rx="4" fill="#0d2b20" />
    <rect x="18" y="92" width="155" height="8" rx="4" fill="#10b981" />
    <text x="18" y="116" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="700">84% of Annual Goal Reached</text>

    <rect x="240" y="0" width="220" height="150" rx="8" fill="#12382a" stroke="#1b4f3b" stroke-width="1" />
    <text x="258" y="26" fill="#6ee7b7" font-family="sans-serif" font-size="10" font-weight="700">CLEAN WATER WELLS</text>
    <text x="258" y="54" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="900">45 Communities</text>
    <text x="258" y="72" fill="#a7f3d0" font-family="sans-serif" font-size="9">Solar-powered filtration wells installed.</text>
    <rect x="258" y="92" width="184" height="8" rx="4" fill="#0d2b20" />
    <rect x="258" y="92" width="170" height="8" rx="4" fill="#10b981" />
    <text x="258" y="116" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="700">92% of Target Deployed</text>

    <rect x="480" y="0" width="220" height="150" rx="8" fill="#12382a" stroke="#1b4f3b" stroke-width="1" />
    <text x="498" y="26" fill="#6ee7b7" font-family="sans-serif" font-size="10" font-weight="700">EMERGENCY RELIEF</text>
    <text x="498" y="54" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="900">8,000+ Meals</text>
    <text x="498" y="72" fill="#a7f3d0" font-family="sans-serif" font-size="9">Nutritional ration packs distributed.</text>
    <rect x="498" y="92" width="184" height="8" rx="4" fill="#0d2b20" />
    <rect x="498" y="92" width="184" height="8" rx="4" fill="#34d399" />
    <text x="498" y="116" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="700">100% Campaign Complete</text>
  </g>
</svg>